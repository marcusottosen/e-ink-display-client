[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inky-pi-agent"
version = "0.1.0"
description = "Outbound Raspberry Pi agent for an Inky E673 display"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "Pillow>=10,<13"
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
inky-agent = "inky_pi_agent.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/inky_pi_agent", "src/inky_contract"]

[tool.pytest.ini_options]
testpaths = ["tests"]
